  <circle cx="940" cy="340" r="7.0" fill="#7A2400" opacity="0.5"/>
  <circle cx="960" cy="310" r="4.5" fill="#7A2400" opacity="0.45"/>
  <circle cx="980" cy="370" r="3.0" fill="#7A2400" opacity="0.4"/>
  <circle cx="920" cy="360" r="5.0" fill="#7A2400" opacity="0.5"/>
  <circle cx="900" cy="380" r="8.0" fill="#7A2400" opacity="0.45"/>
  <circle cx="850" cy="365" r="6.0" fill="#7A2400" opacity="0.4"/>
