  <circle cx="570" cy="80"  r="7.5" fill="#FF4400" opacity="0.82"/>
  <circle cx="570" cy="113" r="11.5" fill="#FF4400" opacity="0.88"/>
  <circle cx="570" cy="150" r="15.5" fill="#FF4400" opacity="0.92"/>
  <circle cx="570" cy="190" r="18.0" fill="#FF4400" opacity="0.92"/>
