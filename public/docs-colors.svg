<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <defs>
    <!-- halftone dot pattern for bg texture -->
    <pattern id="ht-bg" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.4" fill="#7A2800" opacity="0.55"/>
    </pattern>
    <!-- plus cross pattern -->
    <pattern id="cross-bg" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <line x1="16" y1="11" x2="16" y2="21" stroke="#7A2800" stroke-width="1.5" opacity="0.4"/>
      <line x1="11" y1="16" x2="21" y2="16" stroke="#7A2800" stroke-width="1.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="400" fill="#B85500"/>

  <!-- Cross/plus texture overlay -->
  <rect width="1000" height="400" fill="url(#cross-bg)"/>

  <!-- Background dot texture -->
  <rect width="1000" height="400" fill="url(#ht-bg)"/>

  <!-- Left circle — thick ring, partially off-screen bottom-left -->
  <circle cx="150" cy="320" r="245" fill="none" stroke="#E07A20" stroke-width="44" opacity="0.9"/>

  <!-- Right circle — solid filled, partially off-screen right -->
  <circle cx="680" cy="190" r="275" fill="#DF7A18" opacity="0.88"/>

  <!-- Halftone cluster on left circle interior — dark dots -->
  <circle cx="235" cy="215" r="6.5" fill="#7A2400"/>
  <circle cx="252" cy="228" r="8.0" fill="#7A2400"/>
  <circle cx="271" cy="238" r="9.5" fill="#7A2400"/>
  <circle cx="252" cy="248" r="7.0" fill="#7A2400"/>
  <circle cx="235" cy="234" r="5.0" fill="#7A2400"/>
  <circle cx="219" cy="224" r="3.5" fill="#7A2400"/>
  <circle cx="290" cy="245" r="5.0" fill="#7A2400"/>
  <circle cx="305" cy="255" r="3.5" fill="#7A2400"/>
  <circle cx="219" cy="242" r="4.0" fill="#7A2400"/>
  <circle cx="236" cy="258" r="5.5" fill="#7A2400"/>
  <circle cx="255" cy="268" r="7.0" fill="#7A2400"/>

  <!-- Halftone cascade on right circle — gradient dots from dark-red to bright orange -->
  <!-- Column 1 (leftmost) — small -->
