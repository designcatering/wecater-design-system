<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <defs>
    <pattern id="fd-cross" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <line x1="16" y1="11" x2="16" y2="21" stroke="#063A0A" stroke-width="1.5" opacity="0.5"/>
      <line x1="11" y1="16" x2="21" y2="16" stroke="#063A0A" stroke-width="1.5" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="400" fill="#0A4A10"/>

  <!-- Cross texture -->
  <rect width="1000" height="400" fill="url(#fd-cross)"/>

  <!-- Three overlapping circles — "OOO" arrangement, semi-transparent -->
  <!-- Left circle -->
  <circle cx="280" cy="200" r="175" fill="#1FB83A" opacity="0.45"/>
  <!-- Center circle -->
  <circle cx="500" cy="200" r="175" fill="#1FB83A" opacity="0.45"/>
  <!-- Right circle -->
  <circle cx="720" cy="200" r="175" fill="#1FB83A" opacity="0.45"/>

  <!-- Intersection highlights — left ∩ center -->
  <clipPath id="lc-l"><circle cx="280" cy="200" r="175"/></clipPath>
  <circle cx="500" cy="200" r="175" fill="#2AE845" opacity="0.3" clip-path="url(#lc-l)"/>

  <!-- Intersection highlights — center ∩ right -->
  <clipPath id="cr-c"><circle cx="500" cy="200" r="175"/></clipPath>
  <circle cx="720" cy="200" r="175" fill="#2AE845" opacity="0.3" clip-path="url(#cr-c)"/>

  <!-- Center inner circle (all three overlap) — brighter -->
  <clipPath id="all-l"><circle cx="280" cy="200" r="175"/></clipPath>
  <clipPath id="all-c"><circle cx="500" cy="200" r="175"/></clipPath>
  <clipPath id="all-r"><circle cx="720" cy="200" r="175"/></clipPath>

  <!-- Halftone cluster left-of-center circle -->
