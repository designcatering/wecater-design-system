  <circle cx="480" cy="82"  r="2.5" fill="#CC2200" opacity="0.7"/>
  <circle cx="480" cy="106" r="3.0" fill="#CC2200" opacity="0.75"/>
  <circle cx="480" cy="132" r="3.5" fill="#CC2200" opacity="0.8"/>
  <circle cx="480" cy="160" r="4.0" fill="#CC2200" opacity="0.8"/>
  <circle cx="480" cy="190" r="4.5" fill="#CC2200" opacity="0.75"/>
  <circle cx="480" cy="220" r="3.5" fill="#CC2200" opacity="0.65"/>
  <circle cx="480" cy="248" r="2.5" fill="#CC2200" opacity="0.5"/>
  <!-- Column 2 -->
  <circle cx="508" cy="48"  r="2.5" fill="#E03300" opacity="0.65"/>
  <circle cx="508" cy="72"  r="3.5" fill="#E03300" opacity="0.75"/>
  <circle cx="508" cy="98"  r="5.0" fill="#E03300" opacity="0.8"/>
  <circle cx="508" cy="126" r="6.5" fill="#E03300" opacity="0.85"/>
